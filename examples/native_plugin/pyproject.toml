[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpnh-native-demo"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["rpnh-harness"]

[project.entry-points."rpnh.plugins"]
demo = "rpnh_demo:plugin"

[tool.setuptools]
py-modules = ["rpnh_demo"]
