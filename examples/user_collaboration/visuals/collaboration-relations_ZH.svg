<text id="text-58" x="503" y="896" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="18" fill="#576780" font-weight="400">原 74-operation PN 的共享契约耦合了被修改的规划器。</text>
<text id="text-59" x="503" y="926" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="18" fill="#576780" font-weight="400">覆盖：原审查 / 报告；本证据导出不含首次 merge analysis 原件。</text>
