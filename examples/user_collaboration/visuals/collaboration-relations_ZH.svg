<text id="text-61" x="65" y="1060" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="20" fill="#192840" font-weight="500">布局不是墙钟时间线；独立分支不证明同时执行。</text>
<text id="text-62" x="65" y="1099" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="19" fill="#576780" font-weight="400">此图是回执派生阅读辅助，不是 PN 运行帧；业务 PN 实图及官方 Viewer 入口另列。</text>
<text id="text-63" x="65" y="1144" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="18" fill="#576780" font-weight="400">审计指针与范围：collaboration-evidence.json</text>
