<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPNH · Registry browser</title><link rel="stylesheet" href="/registry-browser.css"></head>
<body><header><a id="back" href="/" data-label="back">Back to run viewer</a><label><span data-label="language">Language</span> <select id="language"><option value="en">English</option><option value="zh-CN">中文</option></select></label></header>
<main><h1 data-label="title">Registry browser</h1><p class="badge" data-label="readonly">Read-only · Registry indexes and materials</p><p data-label="resourcesHint"></p><details><summary data-label="technical">Technical details</summary><p data-label="scope"></p></details><button type="button" id="refresh" data-label="refresh">Refresh (new observation)</button><p id="status" role="status" aria-live="polite"></p>
<div class="browser"><nav aria-labelledby="sources-title"><button id="navigation-toggle" type="button" aria-controls="navigation-content" aria-expanded="true"></button><div id="navigation-content"><h2 id="sources-title" data-label="sources">Sources / entry types</h2><div id="sources"></div></div></nav>
<section aria-labelledby="location"><h2 id="location" tabindex="-1"></h2><button id="return-previous" type="button" data-label="returnPrevious" hidden>Back to previous view</button><p id="return-limit" class="muted" data-label="returnLimited" hidden></p><p class="muted" data-label="loadedScope"></p><p id="version-scope" class="muted" hidden></p><button id="all-entries" type="button" data-label="allEntries" hidden></button><p id="page-status" class="muted"></p><label class="filter"><span data-label="search">Filter loaded page only</span><input type="search" id="filter"></label>
<div class="table-wrap"><table><thead><tr><th colspan="3" data-label="entry">Entry</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" data-label="empty" hidden></p>
<div class="pagination"><button type="button" id="previous" data-label="previous" disabled>Previous page</button><button type="button" id="next" data-label="next" disabled>Next page</button></div><details class="technical-details"><summary data-label="observation">Observation / coverage</summary><pre id="observation"></pre></details>
<section id="registry-positions" aria-label="Read-only task position history" hidden></section>
<section id="details" aria-labelledby="detail-title" hidden><div class="detail-heading"><h2 id="detail-title" data-label="detail">Exact record</h2><button type="button" id="close" data-label="close">Close details</button></div><section id="links-section" hidden><h3 data-label="links">Declared related records</h3><p class="muted" data-label="linkScope"></p><div id="links"></div><p id="links-more" data-label="linkMore" hidden></p></section><details id="record-section" data-return-key="record-section"><summary data-label="detail">Exact record</summary><pre id="record"></pre></details><button type="button" id="preview" data-label="preview">Preview text</button><p id="unavailable" data-label="unavailable" hidden></p><section id="material-section" hidden><h3 data-label="material">Plain-text material</h3><details><summary data-label="technical">Technical details</summary><pre id="material-meta"></pre></details><pre id="material" tabindex="0"></pre></section></section>
</section></div><section id="human-material-reader" aria-label="Explicit material reading"></section><section id="material-management" aria-label="Material management"></section><section id="material-locations" aria-label="Material locations"></section><section id="material-disable" aria-label="Disable exact material versions"></section><section id="material-carriers" aria-label="Material carrier inspection"></section><section id="material-purge" aria-label="Finite material carrier cleanup"></section></main><script type="module" src="/registry-browser.mjs"></script></body></html>
