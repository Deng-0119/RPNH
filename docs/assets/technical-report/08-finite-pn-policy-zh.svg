<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">有限分析供显式 Owner policy 使用</title><desc id="desc">准确编译网、marking 与有限模型进入有界探索。各属性结论供 advisory policy 或 strict gate 使用；strict 要求每项必需属性均为 HOLDS，原 Registry 关口仍适用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708798"/></marker></defs>
