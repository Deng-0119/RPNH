<text x="927.5" y="459.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">必需属性 → HOLDS</text>
<path d="M 290 282 H 355" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 665 260 H 710 V 168 H 765" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 665 305 H 710 V 428 H 765" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="775" y="287" font-size="23" font-weight="400" text-anchor="start" fill="#536878">原 Registry 关口仍适用</text>
<text x="40" y="542" font-size="23" font-weight="400" text-anchor="start" fill="#536878">未能确定的属性保持 UNKNOWN；分析不执行工具。</text>
