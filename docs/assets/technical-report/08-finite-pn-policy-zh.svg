<text x="165.0" y="297.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Net + marking</text>
<text x="165.0" y="331.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">有限模型</text>
<rect x="365" y="205" width="300" height="155" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="515.0" y="259.5" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">有界分析</text>
<text x="515.0" y="297.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">HOLDS · VIOLATED</text>
<text x="515.0" y="331.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">UNKNOWN · N/A</text>
<rect x="775" y="105" width="305" height="125" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="927.5" y="161.5" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Advisory</text>
<text x="927.5" y="199.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">记录分析结论</text>
<rect x="775" y="365" width="305" height="125" rx="16" fill="#F4F7FA" stroke="#AD640A" stroke-width="2.5"/>
