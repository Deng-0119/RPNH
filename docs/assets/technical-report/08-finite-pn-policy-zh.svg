<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#183042">
<text x="40" y="64" font-size="32" font-weight="700" text-anchor="start" fill="#183042">有限分析供显式 Owner policy 使用</text>
<rect x="40" y="205" width="250" height="155" rx="16" fill="#F4F7FA" stroke="#7655A8" stroke-width="2.5"/>
