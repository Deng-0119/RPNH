<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img">
<title>Continue from a committed checkpoint</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#536579"/></marker></defs>
<rect width="1120" height="420" rx="18" fill="#f6f8fb"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif">
<text x="40" y="48" font-size="25" font-weight="700" fill="#14273a">Continue from a committed checkpoint</text>
<rect x="40" y="105" width="320" height="208" rx="14" fill="white" stroke="#427aad" stroke-width="2"/>
<text x="60" y="141" font-size="20" font-weight="700" fill="#18334a">Select checkpoint</text>
<text x="60" y="180" font-size="17" fill="#33485c">Latest owner-stopped cut</text>
<text x="60" y="210" font-size="17" fill="#33485c">Or explicit selected cut</text>
<text x="60" y="240" font-size="17" fill="#33485c">Exact run and net lineage</text>
<path d="M365 220 H393" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="105" width="320" height="208" rx="14" fill="white" stroke="#be8b34" stroke-width="2"/>
<text x="420" y="141" font-size="20" font-weight="700" fill="#18334a">Restore and reconcile</text>
<text x="420" y="180" font-size="17" fill="#33485c">Petri state and resource refs</text>
<text x="420" y="210" font-size="17" fill="#33485c">Registered workspace revision</text>
<text x="420" y="240" font-size="17" fill="#33485c">Check recorded completion</text>
<path d="M725 220 H753" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="105" width="320" height="208" rx="14" fill="white" stroke="#488976" stroke-width="2"/>
<text x="780" y="141" font-size="20" font-weight="700" fill="#18334a">Continue execution</text>
<text x="780" y="180" font-size="17" fill="#33485c">Admit work under PN rules</text>
<text x="780" y="210" font-size="17" fill="#33485c">Retain interruption history</text>
<text x="780" y="240" font-size="17" fill="#33485c">Do not blindly repeat effects</text>
<text x="40" y="88" font-size="15" fill="#536579">Registry identity, not fault location</text>
<text x="400" y="88" font-size="15" fill="#536579">Before dispatch</text>
<text x="760" y="88" font-size="15" fill="#536579">Same execution contracts</text>
<text x="40" y="350" font-size="16" fill="#536579">Mechanism illustration, not a runtime capture.</text>
<text x="40" y="377" font-size="16" fill="#536579">External messages and remote writes require outcome reconciliation; workspace restoration does not undo them.</text>
</g></svg>