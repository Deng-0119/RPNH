<text x="40" y="64" font-size="32" font-weight="700" text-anchor="start" fill="#183042">A worker result becomes committed evidence</text>
<text x="44" y="117" font-size="24" font-weight="700" text-anchor="start" fill="#2463A6">01</text>
<rect x="40" y="135" width="280" height="118" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="180.0" y="188.0" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">Admit + Start</text>
<text x="180.0" y="226.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Exact firing and lease</text>
<text x="424" y="117" font-size="24" font-weight="700" text-anchor="start" fill="#2463A6">02</text>
<rect x="420" y="135" width="280" height="118" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="560.0" y="188.0" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">Dispatch</text>
<text x="560.0" y="226.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Admitted worker</text>
<text x="804" y="117" font-size="24" font-weight="700" text-anchor="start" fill="#087F82">03</text>
<rect x="800" y="135" width="280" height="118" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="940.0" y="188.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Register products</text>
<text x="940.0" y="226.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Exact output authority</text>
<text x="804" y="322" font-size="24" font-weight="700" text-anchor="start" fill="#087F82">04</text>
