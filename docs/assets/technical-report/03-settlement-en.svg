<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">A worker result becomes committed evidence</title><desc id="desc">The owner admits and records Start before dispatch. Products are registered; settlement closes the successor checkpoint and applicable workspace publication. A declared terminal rule selects the result.</desc>
