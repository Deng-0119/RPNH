<text x="940.0" y="393.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Settle</text>
<text x="940.0" y="431.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Successor checkpoint</text>
<text x="424" y="322" font-size="24" font-weight="700" text-anchor="start" fill="#7655A8">05</text>
<rect x="420" y="340" width="280" height="118" rx="16" fill="#F4F7FA" stroke="#7655A8" stroke-width="2.5"/>
<text x="560.0" y="393.0" font-size="29" font-weight="700" text-anchor="middle" fill="#7655A8">Terminal rule</text>
<text x="560.0" y="431.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Select registered result</text>
<text x="44" y="322" font-size="24" font-weight="700" text-anchor="start" fill="#7655A8">06</text>
<rect x="40" y="340" width="280" height="118" rx="16" fill="#F4F7FA" stroke="#7655A8" stroke-width="2.5"/>
