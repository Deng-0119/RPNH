<text x="420" y="180" font-size="17" fill="#33485c">Firing publication</text>
<text x="420" y="210" font-size="17" fill="#33485c">Successor marking checkpoint</text>
<text x="420" y="240" font-size="17" fill="#33485c">Workspace revision, if used</text>
