<title id="title">Finite analysis informs an explicit owner policy</title><desc id="desc">An exact compiled net, marking and finite models feed bounded exploration. Property verdicts reach either advisory policy or a strict gate requiring each mandatory property to be HOLDS. The existing Registry gates still apply.</desc>
