<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img">
<title>同一 Registry：持久保存，按权威边界读取</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#536579"/></marker></defs>
<rect width="1120" height="420" rx="18" fill="#f6f8fb"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif">
<text x="40" y="48" font-size="25" font-weight="700" fill="#14273a">同一 Registry：持久保存，按权威边界读取</text>
<rect x="40" y="105" width="320" height="208" rx="14" fill="white" stroke="#427aad" stroke-width="2"/>
<text x="60" y="141" font-size="20" font-weight="700" fill="#18334a">已提交历史</text>
<text x="60" y="180" font-size="17" fill="#33485c">准确版本与事件</text>
<text x="60" y="210" font-size="17" fill="#33485c">选定切面上的 canonical 事实</text>
<text x="60" y="240" font-size="17" fill="#33485c">按读取权限使用</text>
<path d="M365 220 H393" stroke-dasharray="4 4" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="105" width="320" height="208" rx="14" fill="white" stroke="#be8b34" stroke-width="2"/>
<text x="420" y="141" font-size="20" font-weight="700" fill="#18334a">持久化暂存区</text>
<text x="420" y="180" font-size="17" fill="#33485c">属于一个活跃 firing</text>
<text x="420" y="210" font-size="17" fill="#33485c">对象、事件、关系等成员</text>
<text x="420" y="240" font-size="17" fill="#33485c">作用域内使用及诊断</text>
<path d="M725 220 H753" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="105" width="320" height="208" rx="14" fill="white" stroke="#488976" stroke-width="2"/>
<text x="780" y="141" font-size="20" font-weight="700" fill="#18334a">发布边界</text>
<text x="780" y="180" font-size="17" fill="#33485c">验证结果与闭合证据</text>
<text x="780" y="210" font-size="17" fill="#33485c">提交 firing publication</text>
<text x="780" y="240" font-size="17" fill="#33485c">推进 canonical 可见性</text>
<text x="40" y="88" font-size="15" fill="#536579">已有权威基础</text>
<text x="400" y="88" font-size="15" fill="#536579">结算前已有持久记录</text>
<text x="760" y="88" font-size="15" fill="#536579">同一 Registry，无需搬移文件</text>
<text x="40" y="350" font-size="16" fill="#536579">机制说明图，不是运行截图。两个逻辑区域都可以包含持久化数据。</text>
<text x="40" y="377" font-size="16" fill="#536579">文件预写 / staging 和私有 workspace 是另外的实现步骤。</text>
<text x="365" y="335" font-size="13" fill="#536579" text-anchor="middle">执行基础</text></g></svg>