<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">One process, explicit authority boundaries</title><desc id="desc">Definitions select trusted registrations. RunOwner and Harness use a typed Petri net and Registry; observers only read selected evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708798"/></marker></defs>
<rect width="1120" height="540" rx="20" fill="#FFFFFF"/>
<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#183042">
<text x="40" y="64" font-size="32" font-weight="700" text-anchor="start" fill="#183042">One process, explicit authority boundaries</text>
<rect x="40" y="140" width="240" height="160" rx="16" fill="#F4F7FA" stroke="#7655A8" stroke-width="2.5"/>
<text x="160.0" y="197.0" font-size="29" font-weight="700" text-anchor="middle" fill="#7655A8">Define</text>
<text x="160.0" y="235.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">ModuleDeclaration</text>
<text x="160.0" y="269.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Author revisions</text>
<rect x="335" y="140" width="240" height="160" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="455.0" y="197.0" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">Bind</text>
<text x="455.0" y="235.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Registration</text>
<text x="455.0" y="269.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Trusted HOST code</text>
<rect x="630" y="140" width="450" height="255" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="855" y="188" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Execute</text>
<text x="855" y="237" font-size="25" font-weight="400" text-anchor="middle" fill="#536878">RunOwner + Harness</text>
<rect x="652" y="300" width="192" height="66" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="748.0" y="344.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Petri net</text>
