<text x="962.0" y="344.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Registry</text>
<path d="M 280 220 H 327" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 575 220 H 622" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="385" width="535" height="95" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="307.5" y="426.5" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">Observe selected evidence</text>
<text x="307.5" y="464.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Read sessions · viewer</text>
<path d="M 855 395 V 432 H 583" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<text x="40" y="512" font-size="23" font-weight="400" text-anchor="start" fill="#536878">Model and provider selection stay with the receiving host.</text>
