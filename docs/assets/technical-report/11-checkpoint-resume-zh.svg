<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img">
<title>从已提交 checkpoint 续跑</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#536579"/></marker></defs>
<rect width="1120" height="420" rx="18" fill="#f6f8fb"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif">
<text x="40" y="48" font-size="25" font-weight="700" fill="#14273a">从已提交 checkpoint 续跑</text>
<rect x="40" y="105" width="320" height="208" rx="14" fill="white" stroke="#427aad" stroke-width="2"/>
<text x="60" y="141" font-size="20" font-weight="700" fill="#18334a">确定 checkpoint</text>
<text x="60" y="180" font-size="17" fill="#33485c">最新 owner-stopped 切面</text>
<text x="60" y="210" font-size="17" fill="#33485c">或显式选定的历史切面</text>
<text x="60" y="240" font-size="17" fill="#33485c">准确 run 与 net lineage</text>
<path d="M365 220 H393" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="105" width="320" height="208" rx="14" fill="white" stroke="#be8b34" stroke-width="2"/>
<text x="420" y="141" font-size="20" font-weight="700" fill="#18334a">恢复并核对</text>
<text x="420" y="180" font-size="17" fill="#33485c">Petri 状态及资源引用</text>
<text x="420" y="210" font-size="17" fill="#33485c">已注册 workspace revision</text>
<text x="420" y="240" font-size="17" fill="#33485c">核对已记录完成证据</text>
<path d="M725 220 H753" stroke="#536579" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="105" width="320" height="208" rx="14" fill="white" stroke="#488976" stroke-width="2"/>
<text x="780" y="141" font-size="20" font-weight="700" fill="#18334a">继续执行</text>
<text x="780" y="180" font-size="17" fill="#33485c">按 PN 规则准入工作</text>
<text x="780" y="210" font-size="17" fill="#33485c">保留中断历史供审查</text>
<text x="780" y="240" font-size="17" fill="#33485c">不盲目重放外部副作用</text>
<text x="40" y="88" font-size="15" fill="#536579">依据 Registry 身份，不依据报错位置</text>
<text x="400" y="88" font-size="15" fill="#536579">派发之前</text>
<text x="760" y="88" font-size="15" fill="#536579">遵循相同执行契约</text>
<text x="40" y="350" font-size="16" fill="#536579">机制说明图，不是运行截图。</text>
<text x="40" y="377" font-size="16" fill="#536579">外部消息与远程写入需要核对结果；workspace 恢复不会撤销这些副作用。</text>
</g></svg>