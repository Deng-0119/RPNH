<g font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" fill="#183042">
<text x="40" y="64" font-size="32" font-weight="700" text-anchor="start" fill="#183042">Origin evidence is bounded to one root and cut</text>
<rect x="40" y="215" width="260" height="125" rx="16" fill="#F4F7FA" stroke="#7655A8" stroke-width="2.5"/>
<text x="170.0" y="271.5" font-size="29" font-weight="700" text-anchor="middle" fill="#7655A8">Exact root + cut</text>
<text x="170.0" y="309.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Authorized source</text>
<rect x="395" y="215" width="280" height="125" rx="16" fill="#F4F7FA" stroke="#2463A6" stroke-width="2.5"/>
<text x="535.0" y="271.5" font-size="29" font-weight="700" text-anchor="middle" fill="#2463A6">Validate closure</text>
<text x="535.0" y="309.5" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Before the first page</text>
<rect x="790" y="105" width="290" height="100" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="935.0" y="149.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Producer proof</text>
<text x="935.0" y="187.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Always included</text>
<rect x="790" y="245" width="290" height="100" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="935.0" y="289.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Start inputs</text>
<text x="935.0" y="327.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Optional relation</text>
<rect x="790" y="385" width="290" height="100" rx="16" fill="#F4F7FA" stroke="#087F82" stroke-width="2.5"/>
<text x="935.0" y="429.0" font-size="29" font-weight="700" text-anchor="middle" fill="#087F82">Claims</text>
<text x="935.0" y="467.0" font-size="23" font-weight="400" text-anchor="middle" fill="#536878">Optional relation</text>
