<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Origin evidence is bounded to one root and cut</title><desc id="desc">The exact authorized root and fixed cut select a validated producer closure. The query returns producer execution proof and optionally Start inputs and claims. It does not read bodies or prove content influence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708798"/></marker></defs>
