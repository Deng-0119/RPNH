<path d="M 675 278 H 727 V 155 H 780" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 675 278 H 727 V 295 H 780" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 675 278 H 727 V 435 H 780" fill="none" stroke="#708798" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="542" font-size="23" font-weight="400" text-anchor="start" fill="#536878">Metadata proof only: no payload reads or content-influence claim.</text>
