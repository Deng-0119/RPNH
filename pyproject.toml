[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpnh-harness"
version = "0.1.0rc5"
description = "Registry-governed agent harness with typed PetriNet execution"
dynamic = ["readme"]
license = "MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "integrations/dsh/UPSTREAM_LICENSE",
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.20,<5",
  "packaging>=24,<27",
  "websockets>=12,<16",
]

[project.urls]
Homepage = "https://github.com/Deng-0119/RPNH"
Documentation = "https://github.com/Deng-0119/RPNH/blob/main/docs/index.md"
Repository = "https://github.com/Deng-0119/RPNH.git"
Issues = "https://github.com/Deng-0119/RPNH/issues"
Changelog = "https://github.com/Deng-0119/RPNH/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional connectors remain opt-in; these pins match the reviewed bridge contracts.
mcp = ["mcp==1.30.0"]
skills = ["strictyaml==1.7.3"]
# Existing AgentLoop integration tests capture the numerical environment.
# Keep these requirements explicit instead of relying on preinstalled packages.
test = ["pytest>=8,<9", "numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.scripts]
rpnh-bootstrap = "cpn.rpnh.bootstrap_entry:main"
rpnh = "cpn.rpnh_cli:main"
rpnh-configure-providers = "cpn.rpnh.provider_setup:main"
rpnh-dsh = "cpn.dsh.launcher:main"

[tool.setuptools.packages.find]
include = ["cpn*", "integrations*"]

[tool.setuptools.package-data]
cpn = [
  "config/*.json",
  "examples/**/*.json",
  "examples/**/*.md",
  "examples/**/*.png",
  "examples/iteration_profile/figures/iteration-profile/initial-petri.svg",
  "examples/**/*.txt",
  "frontend/*.json",
  "frontend/static/*",
  "frontend/static/assets/*",
  "llm_adapters/*.json",
  "schemas/**/*.json",
]
integrations = [
  "dsh/UPSTREAM.json",
  "dsh/UPSTREAM_CANDIDATE.json",
  "dsh/LEGACY_UPSTREAM.json",
  "dsh/UPSTREAM_LICENSE",
  "dsh/prepare.sh",
  "dsh/run.sh",
  "dsh/verify.sh",
  "dsh/patch_upstream.py",
  "dsh/src/*.ts",
  "dsh/operator/index.js",
  "dsh/operator/client.js",
  "dsh/operator/updates.js",
  "dsh/operator/transport.js",
  "dsh/operator/package.json",
  "dsh/operator/cordis.patch.yml",
  "dsh/operator/README*.md",
  "dsh/operator/LICENSE",
  "dsh/frontend/*.ts",
  "dsh/frontend/*.json",
  "dsh/fixtures/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
